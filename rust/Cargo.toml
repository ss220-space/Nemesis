[package]
name = "rustlibs"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
byondapi = { git = "https://github.com/spacestation13/byondapi-rs.git", version = "0.6.14" }
eyre = "0.6.12"
slotmap = "1.0.7"
base64 = "0.22.1"
chrono = "0.4.41"
dmmtools = { git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "0290db5c752fa292f9824521515b603a2afd11dc", package = "dmm-tools" }
dreammaker = { git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "0290db5c752fa292f9824521515b603a2afd11dc", package = "dreammaker" }
fxhash = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
walkdir = "2.5.0"
regex = "1.10.5"
rand = "0.9.3"
itertools = "0.10.5"
diff = "0.1"
uuid = { version = "1.18.1", features = ["v4"] }
